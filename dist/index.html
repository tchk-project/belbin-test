<script id="test-data" type="application/json">{"version":1,"intro":"Просим вас заполнить тест на определение Ключевых ролей в команде. На основании исследований Рэймонд Мередит Белбин выделил 8 типов ролей, которые исполняет человек в зависимости от личных особенностей и качеств: Координатор, Творец, Генератор идей, Исполнитель, Разведчик, Эксперт, Дипломат, Доводчик. Следующий тест — «Командные роли» Р. М. Белбина позволит определить естественные для вас роли в коллективе, а также те роли, от выполнения которых вы предпочли бы отказаться.","instruction":"В каждом из семи блоков данного опросника распределите 10 баллов между возможными ответами согласно тому, как вы полагаете они лучше всего подходят вашему собственному поведению. Если вы согласны с каким-либо утверждением на все 100%, вы можете отдать ему все 10 баллов. При этом одному предложению можно присвоить минимум 2 балла. Проверьте, чтобы сумма всех баллов по каждому блоку не превышала 10.","blocks":[{"title":"Какой вклад я могу внести в работу команды:","questions":[{"id":10,"text":"Я думаю, что способен быстро замечать новые возможности и извлекать из них выгоды."},{"id":11,"text":"Я могу успешно работать с самыми разными людьми."},{"id":12,"text":"Генерация идей — моё врожденное достоинство."},{"id":13,"text":"Моим достоинством является умение находить людей, способных принести пользу команде."},{"id":14,"text":"Моя способность доводить всё до конца во многом обеспечила мою профессиональную эффективность."},{"id":15,"text":"Я готов перенести временную непопулярность, если вижу, что мои действия принесут в конечном счете полезные результаты."},{"id":16,"text":"Я быстро выясняю, что сработает в данной ситуации, если в подобную ситуацию я уже попадал."},{"id":17,"text":"Личные заблуждения и предубеждения не мешают мне находить и доказывать преимущества альтернативных действий."}]},{"title":"Мои недостатки, которые могут проявиться в командной работе:","questions":[{"id":20,"text":"Я чувствую себя неуверенно на совещании, если отсутствуют четкая повестка дня и контроль за её соблюдением."},{"id":21,"text":"Я склонен быть слишком великодушным к людям, имеющим правильную точку зрения, но не высказывающим её открыто."},{"id":22,"text":"Я склонен слишком много говорить, когда в группе обсуждаются новые идеи."},{"id":23,"text":"Вследствие моей осмотрительности я не склонен быстро и с энтузиазмом присоединяться к мнению коллег."},{"id":24,"text":"Я иногда выгляжу авторитарным и нетерпимым, когда чувствую необходимость достичь чего-то."},{"id":25,"text":"Мне трудно повести людей за собой, поскольку я слишком подвержен влиянию атмосферы, царящей в группе."},{"id":26,"text":"Я слишком захвачен идеями, которые мне приходят в голову, и поэтому плохо слежу за тем, что происходит вокруг."},{"id":27,"text":"Мои коллеги находят, что я слишком много внимания уделяю деталям и чрезмерно беспокоюсь о том, что дела идут неправильно."}]},{"title":"Участие в совместном проекте:","questions":[{"id":30,"text":"Я умею влиять на людей, не оказывая на них давления."},{"id":31,"text":"Врожденная осмотрительность предохраняет меня от ошибок, возникающих из-за невнимательности."},{"id":32,"text":"Я готов оказать давление, чтобы совещание не превращалось в пустую трату времени и не терялась из виду основная цель обсуждения."},{"id":33,"text":"Можно рассчитывать на поступление от меня оригинальных предложений."},{"id":34,"text":"Я всегда готов поддержать любое предложение, если оно служит общим интересам."},{"id":35,"text":"Я энергично ищу среди новых идей и разработок свежайшие."},{"id":36,"text":"Я надеюсь, что моя способность выносить беспристрастные суждения признаётся всеми, кто меня знает."},{"id":37,"text":"На меня можно возложить обязанности следить за тем, чтобы наиболее существенная работа была организована должным образом."}]},{"title":"Особенности моего стиля работы в команде:","questions":[{"id":40,"text":"Я постоянно стараюсь лучше узнать своих коллег."},{"id":41,"text":"Я неохотно возражаю своим коллегам и не люблю сам быть в меньшинстве."},{"id":42,"text":"Я обычно нахожу вескую аргументацию против плохих предложений."},{"id":43,"text":"Я полагаю, что обладаю талантом быстро организовать исполнение одобренных планов."},{"id":44,"text":"Я обладаю способностью избегать очевидных решений и умею находить неожиданные."},{"id":45,"text":"Я стремлюсь добиться совершенства при исполнении любой роли в командной работе."},{"id":46,"text":"Я умею устанавливать контакты с внешним окружением команды."},{"id":47,"text":"Я способен воспринимать любые высказываемые мнения, но без колебаний подчиняюсь мнению большинства после принятия решения."}]},{"title":"Я получаю удовлетворение от работы, потому что:","questions":[{"id":50,"text":"Мне доставляет удовольствие анализ ситуаций и взвешивание всех шансов."},{"id":51,"text":"Мне нравится находить практические решения проблем."},{"id":52,"text":"Мне нравиться сознавать, что я создаю хорошие рабочие взаимоотношения."},{"id":53,"text":"Я способен оказывать сильное влияние на принятие решений."},{"id":54,"text":"Я получаю возможность встретиться с людьми, способными предложить что-то новое для меня."},{"id":55,"text":"Я способен добиться согласия людей на реализацию необходимого курса действий."},{"id":56,"text":"Я чувствую себя в своей стихии, когда могу уделить задаче все мое внимание."},{"id":57,"text":"Мне нравится находить задачи, требующие напряжения воображения."}]},{"title":"Если мне неожиданно предложат решить трудную задачу за ограниченное время с незнакомыми людьми, то:","questions":[{"id":60,"text":"Я бы почувствовал необходимость сначала в одиночестве обдумать пути выхода из тупика, прежде чем начать действовать."},{"id":61,"text":"Я был бы готов работать с человеком, указавшим наиболее позитивный подход, каковы бы ни были связанные с этим трудности."},{"id":62,"text":"Я бы попытался найти способ разбиения задачи на части в соответствии с тем, что лучше всего умеют делать отдельные члены команды."},{"id":63,"text":"Присущая мне обязательность помогла бы нам не отстать от графика."},{"id":64,"text":"Я надеюсь, мне бы удалось сохранить хладнокровие и способность логически мыслить."},{"id":65,"text":"Я бы упорно добивался достижения цели, несмотря ни на какие помехи."},{"id":66,"text":"Я был бы готов действовать силой положительного примера при появлении признаков отсутствия прогресса в командной работе."},{"id":67,"text":"Я бы организовал дискуссию, чтобы стимулировать выдвижение новых идей и придать начальный импульс командной работе."}]},{"title":"Проблемы, с которыми я сталкиваюсь, работая в команде:","questions":[{"id":70,"text":"Я склонен проявлять нетерпимость по отношению к людям, мешающим, по моему мнению, прогрессу в делах группы."},{"id":71,"text":"Окружающие иногда критикуют меня за чрезмерный рационализм и неспособность к интуитивным решениям."},{"id":72,"text":"Мое стремление обеспечить условия, чтобы работа выполнялась правильно, может приводить к снижению темпов."},{"id":73,"text":"Я слишком быстро утрачиваю энтузиазм и стараюсь почерпнуть его у наиболее активных членов группы."},{"id":74,"text":"Я тяжел на подъем, если не имею ясных целей."},{"id":75,"text":"Мне иногда бывает очень трудно разобраться во встретившихся мне сложностях."},{"id":76,"text":"Я стесняюсь обратиться за помощью к другим, когда не могу что-либо сделать сам."},{"id":77,"text":"Я испытываю затруднения при обосновании своей точки зрения, когда сталкиваюсь с серьезными возражениями."}]}],"roles":[{"name":"Доводчик","description":"Доводчик (Completer-Finisher). Старателен и добросовестен. Ищет ошибки и упущения. Контролирует сроки выполнения поручений. Как правило, об успехе команды судят по окончательным результатам ее работы. При этом многие люди почти патологически не могут довести начатое ими до конца, и умение завершать начатое является достаточно редким качеством. Доводчики — это люди, обладающие этим даром в полной мере. Их отличает внимание к деталям и умение держать в голове запланированное, обеспечивая чтобы ничего не упускалось и все детали плана были доведены до завершения. Они предпочитают постоянные усилия, согласованность и последовательность действий «кавалерийским атакам». Они ориентированы на выполнение обязательств и меньше интересуются эффектным и громким успехом. Склонность к достижению совершенства во всем, за что они берутся, и непреклонность в достижении намеченного — их непременные качества. К их слабым сторонам следует отнести недостаточную гибкость, в результате чего они порой тратят слишком много сил на достижение поставленных целей, которые при изменившихся обстоятельствах оказываются недостижимыми."},{"name":"Координатор","description":"Координатор (Coordinator). Поощряющий и поддерживающий тип. Склонен доверять людям и принимать их такими, какие они есть, без проявления ревности или подозрительности. Координатор — это сильное доминирование и преданность групповым целям. Стиль руководства командой Председателя — радушно принимать вносимые вклады в деятельность команды и оценивать их в соответствии с целями команды. Зрелый, уверенный, самодисциплинированный. Спокойный, несуетливый. Умеет четко формулировать цели, продвигает решения, делегирует полномочия. Организует работу команды и использование ресурсов в соответствии с групповыми целями. Имеет ясное представление о сильных и слабых сторонах команды и максимально использует потенциал каждого члена команды. Координатор может не обладать блестящим интеллектом, но он хорошо руководит людьми. Идеальный Координатор выглядит как хороший менеджер, то есть человек, знающий как использовать ресурсы, исключительно адаптивный при общении с людьми, но в то же время никогда не теряющий своего контроля над ситуацией и своей способности принимать самостоятельные решения, основанные на собственной оценке того, что необходимо на практике. Координатор — это хороший лидер для сбалансированной по своему составу команды, перед которой стоят сложные и многогранные проблемы, требующие эффективного распределения ролей внутри команды."},{"name":"Творец","description":"Творец (Shaper). Предпринимательский тип. Творцы всегда выступают как побудители к действию, и если команда склонна к бездействию или самодовольству, то присутствие Формирователя выведет ее из этого состояния. Такой лидер — динамичный, бросает вызов, оказывает давление. Стиль руководства Творца — оспаривать, мотивировать, достигать. Это более индивидуалистичный, чем Координатор тип лидера, который подталкивает людей к действиям и, увлекая их за собой, столь же часто приводит команду к неудаче, как и к успеху. Его мужество и энергия позволяют преодолевать трудности. Творцы по многим параметрам являются антиподами Дипломатов. Ненавидят проигрыши, склонны к провокациям, раздражению и нетерпению. Характеризуются высокой самооценкой, склонностью к фрустрации, общительностью и подозрительным отношением к людям. Это экстраверты, побуждаемые к действиям требованиями внешней среды. Как лидеры они хороши для уже сработанной команды, которая в своей работе столкнулась со сложным, внешним, либо внутренним препятствием. Как менеджеры Творцы процветают в ситуациях, характеризующихся «политической сложностью», сдерживающей движение вперед."},{"name":"Генератор идей","description":"Генератор идей (Plant). Интровертивный тип генератора идей. Изобретателен, обладает богатым воображением — человек с идеями, умеющий решать нестандартные проблемы. Как правило, Генераторы идей действуют в одиночку, сидя в своем углу и обдумывая различные варианты. Обладают высоким интеллектуальным уровнем и очень высоким показателем креативности. Это яркие представители интеллектуалов-одиночек, и они часто воспринимаются членами команды как не слишком коммуникабельные. Им свойственна прямота и честность в общении. Стиль Генератора идей — привносить инновационные идеи в работу команды и ее цели. Он склонен «витать в облаках» и игнорировать детали или протокол. Чем более успешно Генераторы идей осуществляют свою роль в команде, тем меньше их поведение похоже на привычную модель поведения менеджера. В мире организаций Генераторы идей не слишком процветают, и их менеджерская карьера редко бывает блестящей. Как правило, они очень способны и умелы, что приводит к тому, что в большинстве случаев они становятся техническими специалистами, а не занимают высокие управленческие посты. Генераторы идей чаще встречаются в новых, только формирующихся компаниях, поскольку по складу своему они скорее предприниматели, чем менеджеры."},{"name":"Разведчик","description":"Разведчик (Resource Investigator). Экстравертивный тип генератора идей. Энтузиаст, общителен. Это еще один член команды, ориентированный на предложение новых идей. Однако, способ генерации идей Разведчиками и сам характер предлагаемых ими идей отличны от мыслителей. Они склонны не столько сами предлагать оригинальные идеи, сколько «подбирать» фрагменты идей окружающих и развивать их. Разведчики особо искусны в изучении ресурсов за пределами команды. Стиль построения команды Разведчика — создать сеть и собирать полезные ресурсы для команды. При средних показателях интеллектуального уровня и креативности, они общительны, любознательны и социально ориентированы. Благодаря этим качествам и умению использовать ресурсы Разведчики легче, чем Генераторы идей интегрируются в команду. При умелом руководстве лидера команды Генератор идей и Разведчик могут успешно сосуществовать вместе, не покушаясь на территорию друг друга и внося каждый свой вклад в предложение новых идей."},{"name":"Эксперт","description":"Эксперт (Monitor-Evaluator). Рассудителен, проницателен, обладает стратегическим мышлением. Видит все альтернативы, все взвешивает — инспектор. Эксперт объективен при анализе проблем и оценке идей. Редко охваченный энтузиазмом, он защищает команду от принятия импульсивных, отчаянных решений. Представители этой роли ярко не проявляют себя в команде до тех пор, пока не приходит время принятия важных решений. При этом члены команды, предлагающие идеи (Генератор идей и Разведчик) редко являются теми людьми, которые способны оценить выгоду от своих идей и их последствия. Представители этой роли отличаются высоким интеллектуальным уровнем, высокими показателями критичности мышления, особенно это касается их способности выдвигать контраргументы. Эксперты достаточно медлительны в своих рассуждениях и всегда предпочитают все тщательно обдумывать. Экспертам может не хватать вдохновения или способности мотивировать других. Окружающими они могут восприниматься как сухие, несколько занудные и порой чересчур критичные люди. Многие даже удивляются, как представители этой категории вообще становятся менеджерами. Тем не менее Эксперты нередко занимают высокие стратегические посты в организациях."},{"name":"Дипломат","description":"Дипломат (Team Worker). Мягкий, восприимчивый. Умеет слушать, предотвращает трения членов команды — чувствителен по отношению и к индивидам, и к ситуациям. Дипломат играет ориентированную на отношения, поддерживающую роль в команде. Если в команде есть сложные в общении люди, то Дипломаты способны оказать мягкое воздействие на ситуацию и предотвратить потенциальные конфликты, тем самым оказывая помощь формальному лидеру команды в выполнении поставленной задачи. Дипломат может быть нерешителен в момент кризиса. Представители этого типа нередко встречаются среди высшего руководства организаций. Из них получаются отличные наставники молодых менеджеров."},{"name":"Исполнитель","description":"Исполнитель (Implementer). Основным качеством Исполнителей является дисциплинированность; другие же природные способности или интеллект почти всегда в их случае вторичны. Стиль исполнителя в команде — организация работ. Исполнители надежны, консервативны и эффективны. Они обладают внутренней стабильностью и низким уровнем беспокойства. Работают преимущественно на команду, а не ради удовлетворения собственных интересов. Умеют реализовать идеи в практических действиях. Исполнители принимают поставленные перед ними цели, которые становятся частью их морального кодекса, и придерживаются их при выполнении работ. Они систематически составляют планы и выполняют их. Очень эффективные организаторы и администраторы. Они могут иметь недостаток гибкости и не любят непроверенные идеи. В крупных, хорошо структурированных организациях карьера таких людей обычно складывается очень успешно. Успех и признание приходят к Исполнителям со временем в результате того, что они систематически делают ту работу, которую необходимо делать, даже если она не отвечает их внутренним интересам или не приносит удовольствия."}],"key":[[16,13,15,12,10,17,11,14],[20,21,24,26,22,23,25,27],[37,30,32,33,35,36,34,31],[43,47,41,44,46,42,40,45],[51,55,53,57,54,50,52,56],[65,62,66,60,67,64,61,63],[74,76,70,75,73,71,77,72]],"source":{"url":"https://drive.google.com/file/d/1quFSD4G7Qun2iRBbZ8xVw_5J2XpLscAJ/view","pdfSha256":"9f95630251fb3cd3b9877d75753963ed3aa6046765e6370c6761eafcff41deee","xlsxSha256":"15dba7483cc5a9e4e1199f905877445da4c49d0082242d5100a737311250f7f6"}}</script>
<script>
const validValue = v => Number.isInteger(v) && (v === 0 || (v >= 2 && v <= 10));
const validBlock = b => Array.isArray(b) && b.length === 8 && b.every(validValue) && b.reduce((s,v)=>s+v,0) === 10;
function score(answers,key) {
  return Array.from({length:8},(_,role)=>key.reduce((sum,row,b)=>sum+answers[b][row[role]-(b+1)*10],0));
}
function extremes(scores) {
  const ordered=[...scores].sort((a,b)=>b-a);
  return {high:scores.flatMap((v,i)=>v>=ordered[2]?[i]:[]).sort((a,b)=>scores[b]-scores[a]||a-b),low:scores.flatMap((v,i)=>v<=ordered[5]?[i]:[]).sort((a,b)=>scores[a]-scores[b]||a-b)};
}
function restore(raw) {
  try {
    const s=JSON.parse(raw);
    if(!s || s.version!==1 || !Number.isInteger(s.step) || s.step < -1 || s.step > 7) return null;
    if(!Array.isArray(s.answers)||s.answers.length!==7||!s.answers.every(b=>Array.isArray(b)&&b.length===8&&b.every(validValue))) return null;
    if(!Array.isArray(s.comments)||s.comments.length!==8||!s.comments.every(c=>typeof c==='string'&&c.length<=5000)) return null;
    if(s.step===7&&!s.answers.every(validBlock))s.step=s.answers.findIndex(b=>!validBlock(b));
    return {version:1,answers:s.answers,comments:s.comments,step:s.step};
  } catch { return null; }
}

async function shareReport(text, browser) {
  if (typeof browser.share !== 'function') return 'unavailable';
  try {
    await browser.share({title:'Тест Белбина — результаты',text});
    return 'shared';
  } catch (error) {
    return error?.name === 'AbortError' ? 'cancelled' : 'failed';
  }
}

async function sharePdfFile(file,browser){
 try{
  if(typeof browser.share!=='function'||typeof browser.canShare!=='function'||!browser.canShare({files:[file]}))return 'unavailable';
  await browser.share({files:[file],title:'Тест Белбина — результаты'});return 'shared';
 }catch(error){return error?.name==='AbortError'?'cancelled':'failed';}
}

// Offline PDF writer: embedded TrueType, selectable Unicode text, A4 pages.
const SITE_URL='https://tchk-project.github.io/belbin-test/';
function createReportPdf(pages,font){
 const enc=new TextEncoder(),objects=[null],used=new Map();
 const add=value=>(objects.push(value),objects.length-1);
 const bytes=s=>enc.encode(s);
 const concat=parts=>{const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let at=0;for(const p of parts){out.set(p,at);at+=p.length;}return out;};
 const stream=(data,extra='')=>concat([bytes(`<< /Length ${data.length} ${extra} >>\nstream\n`),data,bytes('\nendstream')]);
 const info=char=>font.chars[char.codePointAt(0)]||font.chars[63];
 const width=(s,size)=>Array.from(s).reduce((n,c)=>n+info(c)[1]*size/1000,0);
 const hex=s=>Array.from(s).map(c=>{const cp=c.codePointAt(0),key=font.chars[cp]?cp:63;if(!used.has(key))used.set(key,used.size+1);return used.get(key).toString(16).padStart(4,'0');}).join('');
 const utf16=cp=>cp<=65535?cp.toString(16).padStart(4,'0'):[0xd800+((cp-65536)>>10),0xdc00+((cp-65536)&1023)].map(n=>n.toString(16)).join('');
 const catalog=add(''),pagesId=add(''),fontId=add('');
 const pageIds=[];
 const draw=(s,x,y,size,color='0.10 0.20 0.17')=>`BT /F1 ${size} Tf ${color} rg 1 0 0 1 ${x} ${y} Tm <${hex(s)}> Tj ET\n`;
 const rgb=color=>color.slice(1).match(/../g).map(v=>(parseInt(v,16)/255).toFixed(4)).join(' ');
 pages.forEach((nodes,index)=>{
  let content='';
  for(const n of nodes)content+=n.type==='text'?draw(n.text,n.x,841.89-n.y,n.size,rgb(n.color)):`${rgb(n.color)} rg ${n.x} ${841.89-n.y-n.h} ${n.w} ${n.h} re f\n`;
  const links=nodes.filter(n=>n.type==='text'&&n.text==='Пройти тест: '+SITE_URL).map(n=>add(`<< /Type /Annot /Subtype /Link /Rect [${n.x} ${841.89-n.y-3} 547 ${841.89-n.y+n.size}] /Border [0 0 0] /A << /S /URI /URI (${SITE_URL}) >> >>`));
  const contentId=add(stream(bytes(content)));
  pageIds.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${contentId} 0 R /Annots [${links.map(id=>`${id} 0 R`).join(' ')}] >>`));
 });
 const fontBytes=Uint8Array.from(atob(font.base64),c=>c.charCodeAt(0));
 const fileId=add(stream(fontBytes,`/Length1 ${fontBytes.length}`));
 const descriptor=add(`<< /Type /FontDescriptor /FontName /DejaVuSans /Flags 32 /FontBBox [-1100 -500 2200 1300] /ItalicAngle 0 /Ascent 928 /Descent -236 /CapHeight 729 /StemV 80 /FontFile2 ${fileId} 0 R >>`);
 const gidMap=new Uint8Array((used.size+1)*2);const widths=[];const mappings=[];
 for(const [cp,cid] of used){const [gid,w]=font.chars[cp];gidMap[cid*2]=gid>>8;gidMap[cid*2+1]=gid&255;widths.push(`${cid} [${w}]`);mappings.push(`<${cid.toString(16).padStart(4,'0')}> <${utf16(cp)}>`);}
 const gidId=add(stream(gidMap));
 let cmap='/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /BelbinUnicode def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <ffff>\nendcodespacerange\n';
 for(let i=0;i<mappings.length;i+=100){const batch=mappings.slice(i,i+100);cmap+=`${batch.length} beginbfchar\n${batch.join('\n')}\nendbfchar\n`;}
 cmap+='endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend';
 const unicode=add(stream(bytes(cmap)));
 const descendant=add(`<< /Type /Font /Subtype /CIDFontType2 /BaseFont /DejaVuSans /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${descriptor} 0 R /W [${widths.join(' ')}] /CIDToGIDMap ${gidId} 0 R >>`);
 objects[fontId]=`<< /Type /Font /Subtype /Type0 /BaseFont /DejaVuSans /Encoding /Identity-H /DescendantFonts [${descendant} 0 R] /ToUnicode ${unicode} 0 R >>`;
 objects[catalog]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
 objects[pagesId]=`<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(id=>`${id} 0 R`).join(' ')}] >>`;
 const parts=[bytes('%PDF-1.4\n')],offsets=[0];let offset=parts[0].length;
 for(let i=1;i<objects.length;i++){offsets[i]=offset;const body=objects[i] instanceof Uint8Array?objects[i]:bytes(objects[i]);const part=concat([bytes(`${i} 0 obj\n`),body,bytes('\nendobj\n')]);parts.push(part);offset+=part.length;}
 parts.push(bytes(`xref\n0 ${objects.length}\n0000000000 65535 f \n${offsets.slice(1).map(n=>`${String(n).padStart(10,'0')} 00000 n \n`).join('')}trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${offset}\n%%EOF\n`));
 return concat(parts);
}


function layoutReport(data,answers,comments,font){
 const scores=data.key[0].map((_,i)=>data.key.reduce((sum,row,b)=>sum+answers[b][row[i]-(b+1)*10],0));
 const order=scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]||a-b);
 const high=order.filter(i=>scores[i]>=scores[order[2]]),low=order.filter(i=>scores[i]<=scores[order[5]]).sort((a,b)=>scores[a]-scores[b]||a-b);
 const pages=[[]];let page=pages[0],y=48;
 const color='#193d33',muted='#596b60',green='#164d43';
 const measure=(s,size)=>Array.from(s).reduce((n,c)=>n+(font.chars[c.codePointAt(0)]||font.chars[63])[1]*size/1000,0);
 const wrap=(s,size,width)=>{const out=[];for(const paragraph of String(s).split(/\r?\n/)){let line='';for(const word of paragraph.split(/( +)/)){if(line&&measure(line+word,size)>width){out.push(line.trimEnd());line='';}for(const c of word){if(line&&measure(line+c,size)>width){out.push(line);line='';}line+=c;}}out.push(line.trimEnd());}return out;};
 const ensure=h=>{if(y+h>775){page=[];pages.push(page);y=48;}};
 const text=(s,x,at,size=10,fill=color)=>page.push({type:'text',text:s,x,y:at,size,color:fill});
 const rect=(x,at,w,h,fill)=>page.push({type:'rect',x,y:at,w,h,color:fill});
 const paragraph=(s,size=10.5,gap=9)=>{const lines=wrap(s,size,499);for(const line of lines){ensure(size*1.5);text(line,48,y+size,size);y+=size*1.5;}y+=gap;};
 const heading=(s,size=17)=>{ensure(65);paragraph(s,size,12);};
 text('ТЕСТ ЗАВЕРШЁН · 70 ИЗ 70 БАЛЛОВ',48,y,9,muted);y+=27;
 heading('Ваши командные роли',28);
 paragraph('Посмотрите на роли с наибольшими и наименьшими баллами. Прочитайте их описание и отметьте, насколько это про вас.',11,20);
 const groups=[['Ведущие роли',high],['Роли с меньшими баллами',low]];
 const cardLines=groups.map(([title,ids])=>[title,...ids.map(i=>`${data.roles[i].name}: ${scores[i]}`)]);
 const cards=cardLines.map(lines=>lines.flatMap((s,i)=>wrap(s,i===0?13:11,215).map(text=>({text,size:i===0?13:11}))));
 const cardHeight=Math.max(...cards.map(lines=>lines.length))*19+32;ensure(cardHeight+18);
 cards.forEach((lines,i)=>{const x=48+i*258;rect(x,y,241,cardHeight,i===0?'#eef1e7':'#f5f5f1');lines.forEach((line,j)=>text(line.text,x+13,y+23+j*19,line.size));});y+=cardHeight+20;
 if(high.length>3||low.length>3)paragraph('На границе тройки есть одинаковые баллы: показаны все роли с этим результатом. В исходнике нет правила выбора между равными результатами.',9.5);
 heading('Все восемь ролей');

const buttonIcons={"share": "<path d=\"M12 16V3m-5 5 5-5 5 5M5 13v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7\"/>", "pdf": "<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5\"/>", "copy": "<rect x=\"8\" y=\"8\" width=\"12\" height=\"13\" rx=\"2\"/><path d=\"M16 8V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4\"/>", "download": "<path d=\"M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5\"/>", "print": "<path d=\"M6 9V2h12v7M6 18H3V9h18v9h-3M6 14h12v8H6zM17 12h1\"/>", "edit": "<path d=\"m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14z\"/>", "back": "<path d=\"M20 12H4m7-7-7 7 7 7\"/>", "next": "<path d=\"M4 12h16m-7-7 7 7-7 7\"/>", "reset": "<path d=\"M3 10a9 9 0 1 1 1 8M3 3v7h7\"/>"};
const icon=name=>`<svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${buttonIcons[name]}</svg>`;
const data=JSON.parse(document.getElementById('test-data').textContent);
const storageKey='belbin-volunteer-v1';
const blank=()=>({version:1,answers:Array.from({length:7},()=>Array(8).fill(0)),comments:Array(8).fill(''),step:-1});
let state=blank(),storageAvailable=true;
const $=id=>document.getElementById(id);

function notice(message){$('notice').textContent=message;$('notice').hidden=!message;}
try{const raw=localStorage.getItem(storageKey);if(raw){const loaded=restore(raw);if(loaded)state=loaded;else notice('Сохранённые ответы повреждены или относятся к другой версии. Они не загружены. Можно начать новое прохождение.');}}
catch{storageAvailable=false;notice('Браузер не разрешает сохранять прогресс. Тест работает, но при закрытии страницы ответы могут потеряться.');}
function persist(){
 try{localStorage.setItem(storageKey,JSON.stringify(state));storageAvailable=true;$('save-status').textContent='✓ Сохранено в этом браузере';}
 catch{storageAvailable=false;$('save-status').textContent='Прогресс не сохраняется';notice('Не удалось сохранить ответы. Не закрывайте страницу до завершения; готовый результат можно скачать.');}
}
const completed=()=>state.answers.filter(validBlock).length;
function chrome(){
 const count=completed();$('progress-label').textContent=`Пройдено ${count} из 7 · осталось ${7-count}`;$('progress-fill').style.width=`${count/7*100}%`;
 $('steps').innerHTML=`<button class="step" data-step="-1" ${state.step===-1?'aria-current="step"':''} aria-label="Инструкция"><span class="step-number" aria-hidden="true">i</span><span class="step-title">Инструкция</span></button>`+data.blocks.map((b,i)=>`<button class="step ${validBlock(state.answers[i])?'done':''}" data-step="${i}" ${state.step===i?'aria-current="step"':''} aria-label="Блок ${i+1}${validBlock(state.answers[i])?', завершён':''}"><span class="step-number" aria-hidden="true">${validBlock(state.answers[i])?'✓':i+1}</span><span class="step-title">Блок ${i+1}</span></button>`).join('')+`<button class="step" data-step="7" ${state.step===7?'aria-current="step"':''} ${count!==7?'disabled':''} aria-label="Результаты"><span class="step-number" aria-hidden="true">↗</span><span class="step-title">Результаты</span></button>`;
}
function go(step){if(step===7&&completed()!==7)return;state.step=step;persist();render();$('main').focus();window.scrollTo({top:0,behavior:'instant'});}
function intro(){
 $('main').innerHTML=`<p class="eyebrow">7 блоков · 56 утверждений · 8 ролей</p><h1 class="hero-title">Ваша роль<br>в общей работе.</h1><p class="lead">Тест Белбина на определение ключевых командных ролей</p><div class="intro-grid"><section class="panel"><h2>Инструкция</h2><p class="source-text">${esc(data.instruction)}</p><details><summary>Введение из исходного документа</summary><p>${esc(data.intro)}</p></details></section><section class="panel accent-panel"><p class="eyebrow">В каждом блоке</p><p class="big-number">10<span style="font:18px system-ui"> баллов</span></p><p class="source-text">Между этими 8 фразами нужно распределить 10 баллов.</p><p class="source-text">Нельзя 1 балл. 2-10 можно. Остальные не трогаете.</p><p class="small">Уточнение организатора. Незаполненное утверждение обозначается нулём. В каждом блоке сумма должна быть ровно 10.</p></section></div><div class="start-row"><button class="primary" id="start">${state.answers.some(b=>b.some(v=>v>0))?'Продолжить тест':'Начать тест'} ${icon('next')}</button><span class="small">Можно вернуться к любому блоку.<br>Прогресс сохраняется на этом устройстве.</span></div><p class="small source-note">Формулировки и описания — из предоставленного PDF. Подсчёт — по его таблице-ключу, сверенной с Excel. Сайт не отправляет ваши ответы другим людям.</p>`;
 $('start').onclick=()=>{const next=state.answers.findIndex(b=>!validBlock(b));go(next===-1?7:next);};
}
function allocation(){
 const sum=state.answers[state.step].reduce((s,v)=>s+v,0);const valid=validBlock(state.answers[state.step]);
 $('allocation').classList.toggle('invalid',sum>10);$('allocation-total').textContent=`${sum} / 10`;
 $('allocation-status').textContent=sum===10?'Все 10 баллов распределены':sum>10?`Уберите ${sum-10} балл(а), чтобы сумма была 10`:`Осталось распределить: ${10-sum}`;
 $('next').disabled=!valid;chrome();
}
function block(){
 const i=state.step,b=data.blocks[i];
 $('main').innerHTML=`<p class="eyebrow">Блок ${i+1} из 7</p><h1>${esc(b.title)}</h1><div class="allocation" id="allocation"><div><p id="allocation-status" role="status" aria-live="polite"></p><p>Допустимые баллы: 0 и 2–10. Один балл присваивать нельзя.</p></div><strong id="allocation-total" aria-label="Сумма баллов в блоке"></strong></div><div class="question-list">${b.questions.map((q,j)=>`<div class="question ${state.answers[i][j]?'selected':''}"><span class="question-id" aria-hidden="true">${q.id}.</span><label id="label-${q.id}" for="q-${q.id}">${esc(q.text)}</label><select id="q-${q.id}" data-question="${j}" aria-labelledby="label-${q.id}">${[0,2,3,4,5,6,7,8,9,10].map(v=>`<option value="${v}" ${state.answers[i][j]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}</div><p class="block-hint">0 — оставить утверждение без баллов. Переход дальше доступен при сумме 10.</p><div class="block-nav"><button class="secondary" id="back">${icon('back')} ${i===0?'Инструкция':'Назад'}</button><button class="primary" id="next">${i===6?'Показать результаты':'Следующий блок'} ${icon('next')}</button></div>`;
 $('main').querySelectorAll('select').forEach(el=>el.addEventListener('change',()=>{state.answers[i][Number(el.dataset.question)]=Number(el.value);el.closest('.question').classList.toggle('selected',Number(el.value)>0);persist();allocation();}));
 $('back').onclick=()=>go(i-1);$('next').onclick=()=>{if(validBlock(state.answers[i])){if(i===6&&completed()!==7)go(state.answers.findIndex(b=>!validBlock(b)));else go(i+1);}};allocation();
}
function reportText(){
 const scores=score(state.answers,data.key),{high,low}=extremes(scores);
 const list=indices=>indices.map(i=>`${data.roles[i].name}: ${scores[i]}`).join('\n');
 return ['Тест Белбина — результаты','Баллы: 70 из 70. В каждом блоке: 10.','','Наибольшие баллы (три роли, включая равенства на границе):',list(high),'','Наименьшие баллы (три роли, включая равенства на границе):',list(low),'','Все роли:',...scores.map((_,i)=>i).sort((a,b)=>scores[b]-scores[a]||a-b).map(i=>`${data.roles[i].name}: ${scores[i]}${state.comments[i].trim()?'\nМой комментарий: '+state.comments[i]:''}`),'','Ответы по блокам:',...data.blocks.map((b,i)=>`Блок ${i+1}: `+b.questions.map((q,j)=>`${q.id}=${state.answers[i][j]}`).join(', ')),'','Источник: '+data.source.url,'','Пройти тест: '+SITE_URL].join('\n');
}
function downloadText(){const url=URL.createObjectURL(new Blob([reportText()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='belbin-result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('action-status').textContent='Файл результата подготовлен к скачиванию.';}
async function copyText(){try{await navigator.clipboard.writeText(reportText());$('action-status').textContent='Результаты и ваши комментарии скопированы.';}catch{$('action-status').textContent='Автоматическое копирование недоступно. Выделите текст ниже или скачайте файл.';let area=$('copy-fallback');if(!area){area=document.createElement('textarea');area.id='copy-fallback';area.readOnly=true;area.setAttribute('aria-label','Текст результата для ручного копирования');$('action-status').after(area);}area.value=reportText();area.focus();area.select();}}
async function shareText(){
 const button=$('share');button.disabled=true;
 const outcome=await shareReport(reportText(),navigator);
 button.disabled=false;
 const messages={shared:'Результат передан выбранному приложению.',cancelled:'Отправка отменена.',unavailable:'Этот браузер не поддерживает меню отправки. Нажмите «Скопировать результат» или «Скачать текст».',failed:'Не удалось открыть отправку. Нажмите «Скопировать результат» или «Скачать текст».'};

 if(outcome==='unavailable'||outcome==='failed')$('copy').focus();

const pdfFont=JSON.parse($('pdf-font').textContent);
if(document.fonts)document.fonts.load('10px BelbinReport').catch(()=>{});
let reportCache=null;
function fullReport(){
 const signature=JSON.stringify([state.answers,state.comments]);
 if(reportCache?.signature!==signature){const pages=layoutReport(data,state.answers,state.comments,pdfFont);reportCache={signature,pages,file:new File([createReportPdf(pages,pdfFont)],'belbin-result.pdf',{type:'application/pdf'})};}
 return reportCache;
}
function downloadPdf(file){
 const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function sharePdf(){
 const button=$('share-pdf');button.disabled=true;
 try{
  const file=fullReport().file;
  const outcome=await sharePdfFile(file,navigator);
  if(outcome==='shared')$('action-status').textContent='PDF передан выбранному приложению.';
  else if(outcome==='cancelled')$('action-status').textContent='Отправка отменена.';
  else if(outcome==='unavailable'){downloadPdf(file);$('action-status').textContent='Браузер не поддерживает отправку файлов. PDF подготовлен к скачиванию.';}
  else{$('action-status').textContent='Не удалось отправить PDF. ';const save=document.createElement('button');save.className='secondary';save.innerHTML=icon('download')+'Скачать PDF';save.onclick=()=>downloadPdf(file);$('action-status').append(save);}
 }catch{$('action-status').textContent='Не удалось подготовить PDF. Попробуйте ещё раз.';}
 finally{button.disabled=false;}
}
function preparePrint(){

}
function finishPrint(){document.body.classList.remove('printing-report');$('print-report').innerHTML='';}

?'<span class="pill">Наибольшие баллы</span>':''}${low.includes(i)?'<span class="pill">Наименьшие баллы</span>':''}</summary><p class="role-description">${esc(data.roles[i].description)}</p><label for="comment-${i}">Мой комментарий: насколько это про меня</label><textarea id="comment-${i}" data-role="${i}" maxlength="5000" placeholder="Ваши впечатления после прочтения…">${esc(state.comments[i])}</textarea></details>`).join('')}</div><div class="actions"><button class="primary" id="share">${icon('share')}Поделиться результатом</button><button class="secondary" id="share-pdf">${icon('pdf')}Поделиться PDF</button><button class="secondary" id="copy">${icon('copy')}Скопировать результат</button><button class="secondary" id="download">${icon('download')}Скачать текст</button><button class="secondary" id="print">${icon('print')}Печать / PDF</button><button class="secondary" id="edit">${icon('edit')}Изменить ответы</button></div><p class="small" id="action-status" role="status" aria-live="polite"></p><p class="small report-site">Пройти тест: <a href="${SITE_URL}">${SITE_URL}</a></p><p class="small source-note">Описания приведены по исходному документу без изменения формулировок. Результаты и комментарии никуда не отправляются автоматически.</p>`;
 $('main').querySelectorAll('textarea[data-role]').forEach(el=>el.addEventListener('input',()=>{state.comments[Number(el.dataset.role)]=el.value;persist();}));
 fullReport();$('share').onclick=shareText;$('share-pdf').onclick=sharePdf;$('copy').onclick=copyText;$('download').onclick=downloadText;$('print').onclick=printReport;$('edit').onclick=()=>go(0);
}

$('reset').innerHTML=icon('reset')+'Начать заново';
